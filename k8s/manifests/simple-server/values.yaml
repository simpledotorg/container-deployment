image:
  repository: simpledotorg/server
  pullPolicy: IfNotPresent
  tag: latest
existingSecret: "simple-server"
existingConfigmap: "simple-server"
existingDBSecret:
  name: "simple-pguser-simple"
  key: "password"
ingress:
  enabled: false
migration:
  enabled: false
cron:
  name: "simple-cron"
  nodeSelector: {}
  affinity: {}
  tolerations: []
  enabled: true
  replicaCount: 1
  resources: {}
  podAnnotations: {}
  log:
    storage: 1Gi
  appLog:
    storage: 1Gi
  image:
    repository: simpledotorg/server
    tag: ""
  # Empty by default, so environments that do not set it render unchanged.
  # Set per environment where a Pod Security Admission profile requires it.
  containerSecurityContext: {}
server:
  name: "simple-server"
  nodeSelector: {}
  affinity: {}
  tolerations: []
  enabled: true
  replicaCount: 2
  resources: {}
  podAnnotations: {}
  log:
    storage: 1Gi
  podSecurityContext: {
    fsGroup: 9999
  }
  containerSecurityContext: {}
worker:
  name: "simple-worker"
  nodeSelector: {}
  affinity: {}
  tolerations: []
  enabled: true
  replicaCount: 1
  resources: {}
  podAnnotations: {}
  log:
    storage: 1Gi
  podSecurityContext: {
    fsGroup: 9999
  }
  containerSecurityContext: {}
workerCphc:
  name: "simple-worker-cphc"
  nodeSelector: {}
  affinity: {}
  tolerations: []
  enabled: false
  replicaCount: 1
  resources: {}
  podAnnotations: {}
  log:
    storage: 1Gi
  podSecurityContext: {
    fsGroup: 9999
  }
  containerSecurityContext: {
    capabilities: {
      add: ["NET_ADMIN"]
    }
  }
migration:
  name: "migration-job"
  nodeSelector: {}
  affinity: {}
  tolerations: []
  enabled: false
  resources: {}
  podAnnotations: {}
  # Both default empty so every existing environment renders unchanged.
  #
  # podSecurityContext was previously declared here as `{fsGroup: 9999}` but
  # migration-job.yaml never referenced it, so it had no effect. Now that the
  # template does reference it, keeping the old default would have silently added
  # a securityContext to the migration Job in six environments. The Job mounts no
  # volumes, so fsGroup bought nothing; defaulting to {} preserves the behaviour
  # those environments have always had. Set it per environment if needed.
  podSecurityContext: {}
  containerSecurityContext: {}
metrics:
  enabled: false
logTailer:
  enabled: true
  image:
    repository: ubuntu
    pullPolicy: IfNotPresent
    tag: 22.04
service:
  port: 80
