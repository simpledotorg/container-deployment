# Attaches the registry pull secret to the default ServiceAccount in simple-v1.
#
# The simple-server and patient-scoring charts render no imagePullSecrets field
# and no serviceAccountName, so their pods run under `default` and there is no
# values key to set. Attaching the secret to the ServiceAccount is the only way
# to reach them without changing the shared charts.
#
# Every other component sets imagePullSecrets through its own chart values.
#
# `default` already exists - Kubernetes creates it with the namespace - so Argo
# CD adopts it rather than creating it. Delete=false keeps Argo CD from removing
# the ServiceAccount if this Application is ever pruned; deleting the default
# ServiceAccount of a live namespace would break every pod in it.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: simple-v1
  annotations:
    argocd.argoproj.io/sync-options: Delete=false
imagePullSecrets:
  - name: gitea-pull
