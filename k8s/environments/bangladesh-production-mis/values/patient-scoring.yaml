database:
  name: "simple_db_bangladesh_production_001"

image:
  repository: git.dghs.gov.bd/NHFB/simpledotorg-simple_patient_scoring
  # STILL A FLOATING TAG. `main` moves, so there is no way to tell what was
  # actually copied into the DGHS registry, and re-mirroring silently changes
  # what runs. Pin to an immutable tag and re-mirror before this environment
  # carries real traffic.
  tag: main

# Halved from AWS. The MIS worker node pool is 2 vCPU / 4 GiB per node, so the
# AWS limits (2 CPU / 8Gi) cannot be scheduled.
resources:
  requests:
    memory: "512Mi"
    cpu: "200m"
  limits:
    memory: "3Gi"
    cpu: "1500m"
