# Ingress values for the MIS cluster.
#
# We run our own controller here. MIS had one pre-installed on the `nginx`
# IngressClass, which is why this file was initially unused, but the cluster
# rebuild on 2026-10-11 removed it. Nothing else now claims that class.
#
# The important difference from both existing values files: this is a TKG
# cluster with a working LoadBalancer implementation, so neither the hostNetwork
# model in k8s/manifests/ingress/values.yaml nor the AWS NLB annotations in
# values.aws-nlb.yaml are appropriate.

ingress-nginx:
  # The registry rejects anonymous pulls.
  imagePullSecrets:
    - name: gitea-pull
  controller:
    kind: 'Deployment'
    # The shared values.yaml sets hostNetwork: true for the on-prem k3s
    # environments. TKG provides LoadBalancer services, so this is unnecessary
    # here and would also complicate PSA compliance.
    hostNetwork: false
    service:
      type: 'LoadBalancer'
      # DGHS publishes this environment on 172.16.48.8, and the address has to
      # be requested in two places: AKO reads its own annotation, and
      # loadBalancerIP is the portable spelling.
      #
      # AKO binds the address when it first creates the VirtualService and does
      # not re-assign an existing one. Setting these on a Service that already
      # has an address changes nothing - the live Service carried both fields
      # for days while AKO kept serving 172.16.48.6. Changing the address
      # therefore means deleting the Service so it is created afresh, which
      # drops all ingress traffic for as long as that takes.
      loadBalancerIP: 172.16.48.8
      annotations:
        ako.vmware.com/load-balancer-ip: "172.16.48.8"
    image:
      registry: git.dghs.gov.bd
      image: nhfb/ingress-nginx-controller
      tag: "v1.9.4"
      # The chart pins a digest alongside the tag. The digest does not match the
      # mirrored copy, because pull-then-push does not reliably preserve a
      # multi-arch manifest digest. Unset both and rely on the tag.
      digest: ""
      digestChroot: ""
