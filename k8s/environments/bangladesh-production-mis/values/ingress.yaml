# Ingress values for the MIS cluster.
#
# We run our own controller here. MIS had one pre-installed on the `nginx`
# IngressClass, which is why this file was initially unused, but the cluster
# rebuild on 2026-10-11 removed it. Nothing else now claims that class.
#
# The important difference from both existing values files: this is a TKG
# cluster with a working LoadBalancer implementation, so neither the hostNetwork
# model in k8s/manifests/ingress/values.yaml nor the AWS NLB annotations in
# values.aws-nlb.yaml are appropriate.

ingress-nginx:
  # The registry rejects anonymous pulls.
  imagePullSecrets:
    - name: gitea-pull
  controller:
    kind: 'Deployment'
    # The shared values.yaml sets hostNetwork: true for the on-prem k3s
    # environments. TKG provides LoadBalancer services, so this is unnecessary
    # here and would also complicate PSA compliance.
    hostNetwork: false
    config:
      # DGHS fronts this environment with a proxy on a public address that
      # terminates TLS and forwards to the cluster over plain HTTP. Without
      # this, the controller judges those requests insecure and redirects them
      # to HTTPS, the proxy forwards the retry as HTTP again, and the browser
      # loops until it gives up - every public URL was unusable while the
      # application behind it was serving 200s perfectly well.
      #
      # Confirmed by patching a live cluster on 2026-11-13: the proxy does send
      # X-Forwarded-Proto, so honouring it is enough and nothing is needed on
      # the DGHS side. Both public hostnames went from a 50-redirect loop to
      # 200 with no redirects.
      #
      use-forwarded-headers: "true"
      # Which sources may be believed when they set X-Forwarded-*. This is the
      # NODE network, not the DGHS proxy's address, which is the opposite of
      # what it looks like it should be: the Service runs with the default
      # externalTrafficPolicy of Cluster, so kube-proxy rewrites the source of
      # every external connection to a node address before nginx sees it. The
      # proxy's own address never reaches the controller, and setting it here
      # would simply never match - nginx would ignore the headers and the
      # redirect loop would come back looking like the fix had failed.
      #
      # Validated against the live cluster on 2026-11-13 with exactly this
      # value: all six public hostnames returned without a redirect (200, and
      # 401 for the two behind basic auth).
      #
      # Note what this does and does not buy. The SNAT has already discarded
      # the real client address by this point, so X-Forwarded-For from the
      # proxy is the only remaining record of it; this narrows who may assert
      # these headers to the cluster's own node network rather than anyone who
      # can reach the controller, which is a real improvement but is not source
      # verification. That would need externalTrafficPolicy: Local, which is a
      # separate change with its own trade-offs.
      proxy-real-ip-cidr: "10.244.0.0/16"
    service:
      type: 'LoadBalancer'
      # DGHS publishes this environment on 172.16.48.8, and the address has to
      # be requested in two places: AKO reads its own annotation, and
      # loadBalancerIP is the portable spelling.
      #
      # AKO binds the address when it first creates the VirtualService and does
      # not re-assign an existing one. Setting these on a Service that already
      # has an address changes nothing - the live Service carried both fields
      # for days while AKO kept serving 172.16.48.6. Changing the address
      # therefore means deleting the Service so it is created afresh, which
      # drops all ingress traffic for as long as that takes.
      loadBalancerIP: 172.16.48.8
      annotations:
        ako.vmware.com/load-balancer-ip: "172.16.48.8"
    image:
      registry: git.dghs.gov.bd
      image: nhfb/ingress-nginx-controller
      tag: "v1.9.4"
      # The chart pins a digest alongside the tag. The digest does not match the
      # mirrored copy, because pull-then-push does not reliably preserve a
      # multi-arch manifest digest. Unset both and rely on the tag.
      digest: ""
      digestChroot: ""
