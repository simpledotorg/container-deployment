ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
  hosts:
    - host: api.ncdbd.dghs.gov.bd
      paths:
        - path: /
          pathType: ImplementationSpecific
    - host: dashboard.ncdbd.dghs.gov.bd
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls:
  - hosts:
    - api.ncdbd.dghs.gov.bd
    secretName: api.ncdbd.dghs.gov.bd-tls
  - hosts:
    - dashboard.ncdbd.dghs.gov.bd
    secretName: dashboard.ncdbd.dghs.gov.bd-tls

# Images come from the DGHS registry. The cluster cannot reach public registries
# reliably, so these must not fall back to the chart defaults. Mirrored by
# scripts/mis-image-mirror; upstream paths are flattened with dashes because the
# Gitea registry allows only one owner segment.
image:
  repository: git.dghs.gov.bd/nhfb/simpledotorg-server
  tag: 19a7f2bbae85ed44f95c00db4e033836b3d33b96

logTailer:
  image:
    repository: git.dghs.gov.bd/nhfb/ubuntu
    tag: "22.04"

# Every log volume below names a StorageClass. This cluster has no default, so
# a claim that does not name one is left with no class and never binds - the
# pods then sit unschedulable on "unbound immediate PersistentVolumeClaims".
# Late binding defers provisioning until the pod is scheduled, matching the rest
# of this environment.

server:
  log:
    storage: 10Gi
    storageClassName: tanzu-storage-policy-latebinding

worker:
  enabled: true
  # 20Gi against AWS's 50Gi, to fit the namespace storage budget.
  log:
    storage: 20Gi
    storageClassName: tanzu-storage-policy-latebinding

cron:
  enabled: true
  log:
    storage: 10Gi
    storageClassName: tanzu-storage-policy-latebinding
  # Defaults to 1Gi in the chart; only the class needs setting here.
  appLog:
    storageClassName: tanzu-storage-policy-latebinding

migration:
  enabled: true

metrics:
  enabled: true

# workerCphc stays disabled. It is an India/CPHC component, and it adds the
# NET_ADMIN capability, which `restricted` forbids.
