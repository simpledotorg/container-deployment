# reloader image from the DGHS registry.
#
# The path is doubled because our wrapper chart is also called `reloader`: the
# outer key is the subchart name, the inner one is the chart's own `reloader`
# block. The chart uses `image.name` rather than the more usual `repository`.

# The registry rejects anonymous pulls, so every pod needs a pull secret. This
# is top-level rather than nested under `reloader:` - Helm fills a subchart's
# .Values.global from the parent's top-level `global` key, so putting it inside
# the subchart's own block has no effect.
#
# These have to be `- name: x` objects, not bare strings. The chart's
# ServiceAccount template emits the list verbatim:
#   imagePullSecrets: {{ toYaml .Values.global.imagePullSecrets | nindent 2 }}
# and a ServiceAccount's imagePullSecrets is a list of LocalObjectReference, so
# a bare string is rejected with "cannot restore struct from: string".
global:
  imagePullSecrets:
    - name: gitea-pull

reloader:
  reloader:
    isArgoRollouts: true
    deployment:
      image:
        name: git.dghs.gov.bd/nhfb/stakater-reloader
        tag: v0.0.124
      # This app lands in the `default` namespace, which carries no Pod
      # Security labels, so it inherits this cluster's `restricted` default and
      # the pod was refused outright:
      #
      #   violates PodSecurity "restricted:latest": allowPrivilegeEscalation
      #   != false, unrestricted capabilities, seccompProfile
      #
      # Reloader is an ordinary workload with no need for host access, so it is
      # made to satisfy `restricted` rather than the namespace loosened.
      #
      # runAsNonRoot and runAsUser repeat the chart's own defaults: this key is
      # rendered with toYaml, so keeping them here states the whole pod-level
      # context in one place rather than relying on the merge.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
