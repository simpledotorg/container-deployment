argo-cd:
  # Images from the DGHS registry. Note Argo CD itself is installed by hand at
  # bootstrap with these same values, before it manages itself - the cluster
  # cannot pull from quay.io, ghcr.io or public.ecr.aws reliably.
  global:
    image:
      repository: git.dghs.gov.bd/NHFB/argoproj-argocd
      tag: "v2.9.17"
  dex:
    image:
      repository: git.dghs.gov.bd/NHFB/dexidp-dex
      tag: "v2.35.3"
  redis:
    image:
      repository: git.dghs.gov.bd/NHFB/docker-library-redis
      tag: "7.0.5-alpine"
  notifications:
    argocdUrl: "https://argocd.ncdbd.dghs.gov.bd"
  server:
    ingress:
      enabled: true
      annotations:
        nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
        nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
        cert-manager.io/cluster-issuer: "letsencrypt-prod"
      ingressClassName: "nginx"
      hosts:
        - argocd.ncdbd.dghs.gov.bd
      paths:
        - /
      pathType: Prefix
      tls:
        - secretName: argocd.ncdbd.dghs.gov.bd-tls
          hosts:
            - argocd.ncdbd.dghs.gov.bd
      https: false
  configs:
    cm:
      accounts.cicd: login
      accounts.priyanga: login
      accounts.dan: login
      accounts.atharva: login
      accounts.roypeter: login
      accounts.ayushi: login
      accounts.gyan: login
      accounts.igbanam: login
      accounts.arnaud: login
      accounts.sagar: login
      accounts.ajay: login

    # https://argo-cd.readthedocs.io/en/stable/operator-manual/rbac/
    rbac:
      policy.default: role:readonly
      policy.csv: |
        p, role:cicd, applications, sync, *, allow
        p, role:cicd, applications, update, *, allow
        g, cicd, role:cicd
        g, priyanga, role:admin
        g, dan, role:admin
        g, atharva, role:admin
        g, roypeter, role:admin
        g, ayushi, role:admin
        g, gyan, role:admin
        g, igbanam, role:admin
        g, arnaud, role:admin
        g, sagar, role:admin
        g, ajay, role:admin
