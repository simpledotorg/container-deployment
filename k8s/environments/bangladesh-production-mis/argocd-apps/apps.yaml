# Application set for bangladesh-production on the DGHS MIS cluster.
#
# Differences from k8s/environments/bangladesh-production/argocd-apps/apps.yaml:
#   - no ingress-nginx      MIS already runs its own controller on the `nginx` class.
#   - no loki               deferred; needs S3-compatible storage MIS does not have.
#   - pgo points at this environment's kustomize overlay, not the shared manifest
#                           path, so the image can be repointed without dragging
#                           India and Sri Lanka along.
#
# repoURL is the internal Gitea mirror, which pull-mirrors the GitHub repo.
# The mirror is private, so Argo CD needs a repository credential for it.

# Namespaces and their Pod Security Admission levels.
# Sync wave -2 so the namespaces exist, correctly labelled, before anything is
# scheduled into them. prune is false: this Application must never be able to
# delete a namespace and everything in it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: namespaces
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  destination:
    name: ''
    server: 'https://kubernetes.default.svc'
  source:
    path: k8s/environments/bangladesh-production-mis/namespaces
    repoURL: 'https://git.dghs.gov.bd/NHFB/container-deployment.git'
    targetRevision: master
  project: default
  syncPolicy:
    syncOptions:
      - PruneLast=true
    automated:
      prune: false
      selfHeal: true

---

# Argocd
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
spec:
  destination:
    name: ''
    namespace: argocd
    server: 'https://kubernetes.default.svc'
  source:
    path: k8s/manifests/argo-cd
    repoURL: 'https://git.dghs.gov.bd/NHFB/container-deployment.git'
    targetRevision: master
    helm:
      valueFiles:
        - ../../environments/bangladesh-production-mis/values/argocd.yaml
  project: default
  syncPolicy:
    syncOptions:
      - PruneLast=true
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true

